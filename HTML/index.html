<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
</head>
<body>

    <h2>Student Admission Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter password" required>
        <br><br>

        <label>Mobile Number:</label>
        <input type="tel" name="phone" placeholder="Enter mobile number">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" min="18" max="60">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" name="hobby" value="coding"> Coding
        <input type="checkbox" name="hobby" value="gaming"> Gaming
        <input type="checkbox" name="hobby" value="travelling"> Travelling
        <br><br>

        <label>Course:</label>
        <select name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
            <option>B.Sc IT</option>
            <option>MCA</option>
        </select>
        <br><br>

        <label>Favourite Color:</label>
        <input type="color" name="color">
        <br><br>

        <label>City:</label>
        <input type="text" name="city" placeholder="Enter your city">
        <br><br>

        <label>Upload Photo:</label>
        <input type="file" name="photo">
        <br><br>

        <label>Feedback:</label>
        <textarea name="feedback" rows="4" cols="30" placeholder="Write your feedback"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
